---
# Exercise the packaged securedrop-admin CLI against the staging environment.
#
- name: Exercise the packaged securedrop-admin CLI
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    molecule_instance_config: "{{ lookup('env', 'MOLECULE_INSTANCE_CONFIG') }}"
    securedrop_admin: /usr/bin/securedrop-admin
    admin_home: "{{ lookup('env', 'HOME') }}"
    admin_config_path: "{{ admin_home }}/.config/securedrop-admin"
    # Reset environment variables so we're mimicking the packaged environment
    # and not this playbook.
    admin_cli_env:
      - /usr/bin/env
      - "-i"
      - "HOME={{ admin_home }}"
      - "PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
      - "LC_ALL=C.UTF-8"
      - "ANSIBLE_HOST_KEY_CHECKING=False"
      - "ANSIBLE_PRIVATE_KEY_FILE={{ identity_file }}"

  tasks:
    - name: Read the instance config written by molecule create
      set_fact:
        instance_conf: "{{ lookup('file', molecule_instance_config) | from_yaml }}"

    - name: Derive SSH details for the staging servers
      set_fact:
        # Every molecule instance shares one Vagrant key and login user.
        ssh_user: "{{ instance_conf[0].user }}"
        identity_file: "{{ instance_conf[0].identity_file }}"
        app_ip: "{{ (instance_conf | selectattr('instance', 'equalto', 'app-staging') | first).address }}"
        monitor_ip: "{{ (instance_conf | selectattr('instance', 'equalto', 'mon-staging') | first).address }}"

    - name: Check that the securedrop-admin package is installed
      stat:
        path: "{{ securedrop_admin }}"
      register: securedrop_admin_binary

    - name: Assert that the securedrop-admin package is installed
      assert:
        that: securedrop_admin_binary.stat.exists
        fail_msg: >-
          {{ securedrop_admin }} not found. Build and install the
          securedrop-admin deb before running this scenario.

    - name: Ensure the admin config directory exists
      file:
        path: "{{ admin_config_path }}"
        state: directory
        mode: "0700"

    # Kept to the bare minimum that inventory-dynamic and these playbooks need
    - name: Write a site-specific config for the packaged CLI
      copy:
        dest: "{{ admin_config_path }}/site-specific"
        mode: "0600"
        content: |
          ---
          # Generated by molecule; not a real site configuration.
          app_ip: {{ app_ip }}
          monitor_ip: {{ monitor_ip }}
          ssh_users: {{ ssh_user }}
          config_path: {{ admin_config_path }}
          ansible_ssh_private_key_file: {{ identity_file }}

    - name: Gather logs and take a backup via the packaged CLI
      command:
        argv: "{{ admin_cli_env + [securedrop_admin, '--force', item] }}"
      loop:
        - logs
        - backup
      changed_when: true

    - name: Look for the artifacts the CLI should have fetched back
      find:
        paths: "{{ admin_config_path }}"
        patterns: "{{ item.pattern }}"
      register: admin_cli_artifacts
      loop:
        - {name: application server logs, pattern: "securedrop-logs-app-*.tar.gz.gpg"}
        - {name: monitor server logs, pattern: "securedrop-logs-mon-*.tar.gz.gpg"}
        - {name: backup tarball, pattern: "sd-backup-*.tar.gz"}
      loop_control:
        label: "{{ item.name }}"

    - name: Assert that the CLI fetched each artifact back
      assert:
        that: item.matched > 0
        fail_msg: >-
          No {{ item.item.name }} found in {{ admin_config_path }}
          (expected {{ item.item.pattern }})
        success_msg: "{{ item.item.name }}: {{ item.files | map(attribute='path') | join(', ') }}"
      loop: "{{ admin_cli_artifacts.results }}"
      loop_control:
        label: "{{ item.item.name }}"
